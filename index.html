
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Little Life 3D V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#18232b;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#14232ddd;border:1px solid #ffffff30;border-radius:12px;padding:10px}
#brand{position:absolute;top:12px;left:12px;font-size:14px}
#stats{position:absolute;right:12px;top:12px;text-align:right;font-size:12px}
#quest{position:absolute;top:75px;left:12px;font-size:12px}
#controls{position:absolute;bottom:15px;left:15px;display:grid;grid-template-columns:55px 55px 55px;gap:5px;pointer-events:auto}
button{background:#183640eF;color:white;border:1px solid #ffffff40;border-radius:12px;padding:14px;font-size:18px;touch-action:none}
#up{grid-column:2}
#left{grid-column:1}
#down{grid-column:2}
#right{grid-column:3}
#actions{position:absolute;right:15px;bottom:20px;pointer-events:auto}
#actions button{font-size:14px;background:#b98b4e}
#dialog{position:absolute;right:15px;bottom:80px;width:210px;font-size:12px;display:none}
#rotate{display:none;position:fixed;inset:0;background:#18232b;z-index:5;align-items:center;justify-content:center;text-align:center}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="rotate">📱<br>Putar HP ke posisi horizontal</div>
<div id="hud">
<div id="brand" class="panel"><b>LITTLE LIFE 3D</b><br>City Life Simulator</div>
<div id="stats" class="panel">HARI 1 · SENIN<br><b id="clock">08:00</b><br>💰 Rp 1.000</div>
<div id="quest" class="panel">🎯 Temui Nadia di taman kota</div>
<div id="controls">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>
<div id="actions"><button id="talk">💬 BICARA</button><button id="run">🏃 LARI</button></div>
<div id="dialog" class="panel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(()=>{
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x899ba6);
scene.fog=new THREE.Fog(0x899ba6,40,110);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.82;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb9c9d5,0x39463e,1.2));
const sun=new THREE.DirectionalLight(0xffe3b4,1.7);
sun.position.set(-24,38,18);
sun.castShadow=true;
scene.add(sun);

function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.9})}
function box(x,y,z,w,h,d,c){
const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
o.position.set(x,y,z);
o.castShadow=true;
o.receiveShadow=true;
scene.add(o);
return o;
}

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(180,180),mat(0x596b60));
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
scene.add(ground);

// Jalan raya
box(0,-.02,0,13,.15,115,0x30383d);
box(-7,-.01,0,2,.15,115,0x77766c);
box(7,-.01,0,2,.15,115,0x77766c);
for(let z=-52;z<60;z+=8)
box(0,.07,z,.16,.03,3.2,0xd8c99c);

// Taman
box(-20,.02,-7,25,.18,34,0x777d69);
box(-20,.13,-7,15,.12,22,0x526e58);

function tree(x,z){
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.18,.25,1.8,7),mat(0x594331));
trunk.position.set(x,.9,z);
scene.add(trunk);
const leaves=new THREE.Mesh(
new THREE.SphereGeometry(1.15,9,7),mat(0x315d48));
leaves.position.set(x,2.3,z);
scene.add(leaves);
}

for(let i=0;i<7;i++){
tree(-29+i*3.5,-22);
tree(-29+i*3.5,8);
tree(-31,-17+i*4);
tree(-9,-17+i*4);
}

// Gedung kota
function building(x,z,w,d,h,color){
box(x,h/2,z,w,h,d,color);
box(x,h+.18,z,w+.25,.35,d+.25,0x343c43);
for(let y=2;y<h-1;y+=2.3){
for(let xx=-w/2+1;xx<w/2-.3;xx+=1.8){
box(x+xx,y,z-d/2-.065,1.05,.95,.08,0x8ba7ad);
}
}
box(x,h*.42,z-d/2-.09,w*.58,.5,.1,0x273b43);
}

building(-16,-28,12,10,11,0x777c80);
building(0,-37,10,9,17,0x626e78);
building(17,-26,12,11,13,0x8a8175);
building(-16,24,13,11,8,0x8c7668);
building(15,23,12,10,10,0x667d79);

// Toko
box(-16,1.7,-22,8,3.4,.5,0x35444a);
box(-16,3.1,-22.3,7,.7,.18,0xc49a61);
box(16,1.5,-18,7,3,.5,0x3a4a50);
box(16,2.8,-18.3,6,.6,.18,0x7d9c91);

// Lampu jalan
function lamp(x,z){
box(x,1.8,z,.12,3.6,.12,0x30383a);
const light=new THREE.Mesh(
new THREE.SphereGeometry(.25,8,8),
new THREE.MeshStandardMaterial({
color:0xffd89b,emissive:0x8d6733
}));
light.position.set(x,3.65,z);
scene.add(light);
}
for(let z=-28;z<34;z+=12){
lamp(-8,z);
lamp(8,z+4);
}

// Bangku
function bench(x,z){
box(x,.55,z,2,.15,.65,0x815b3c);
box(x,.85,z+.25,2,.65,.12,0x815b3c);
box(x,.25,z-.2,.12,.5,.12,0x353b3a);
box(x+.85,.25,z-.2,.12,.5,.12,0x353b3a);
}
bench(-21,-4);
bench(-18,1);
bench(-24,2);

// Karakter
function person(shirt,pants,skin){
const g=new THREE.Group();
const torso=new THREE.Mesh(
new THREE.CapsuleGeometry(.34,.68,4,8),mat(shirt));
torso.position.y=1.15;
g.add(torso);
const head=new THREE.Mesh(
new THREE.SphereGeometry(.27,12,10),mat(skin));
head.position.y=1.92;
g.add(head);
for(let x of [-.16,.16]){
const leg=new THREE.Mesh(
new THREE.BoxGeometry(.17,.68,.2),mat(pants));
leg.position.set(x,.38,0);
g.add(leg);
}
scene.add(g);
return g;
}

const player=person(0x293f59,0x20272d,0xb98262);
player.position.set(0,0,8);

const nadia=person(0xb96d42,0x333d45,0xd4a17c);
nadia.position.set(-19,0,-5);

const walkers=[
person(0x526d7c,0x353d45,0x9a7056),
person(0x6b7654,0x333b46,0xd0a17f),
person(0x8b5d69,0x303a42,0xb78365)
];
walkers[0].position.set(4,0,-19);
walkers[1].position.set(-4,0,25);
walkers[2].position.set(19,0,4);

// Kontrol
const keys={};
let running=false;
function bind(id,key){
const b=document.getElementById(id);
b.addEventListener('pointerdown',e=>{
e.preventDefault();
keys[key]=true;
b.setPointerCapture(e.pointerId);
});
['pointerup','pointercancel','lostpointercapture'].forEach(v=>
b.addEventListener(v,()=>keys[key]=false));
}
bind('up','up');
bind('down','down');
bind('left','left');
bind('right','right');

document.getElementById('run').onclick=()=>{
running=!running;
document.getElementById('run').textContent=
running?'🏃 LARI ON':'🏃 LARI';
};

document.getElementById('talk').onclick=()=>{
const dialog=document.getElementById('dialog');
dialog.style.display='block';
dialog.textContent=
player.position.distanceTo(nadia.position)<4
?'Nadia: Hai! Aku Nadia. Selamat datang di kota ini!'
:'Dekati Nadia yang berbaju cokelat di taman untuk berbicara.';
};

addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

let minutes=480;
const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);
let dx=0,dz=0;

if(keys.up||keys.ArrowUp||keys.KeyW)dz--;
if(keys.down||keys.ArrowDown||keys.KeyS)dz++;
if(keys.left||keys.ArrowLeft||keys.KeyA)dx--;
if(keys.right||keys.ArrowRight||keys.KeyD)dx++;

const n=Math.hypot(dx,dz);
if(n){
dx/=n;dz/=n;
const speed=running?8:4.5;
player.position.x+=dx*speed*dt;
player.position.z+=dz*speed*dt;
player.rotation.y=Math.atan2(dx,dz);
minutes+=dt*(running?4:2);
}

player.position.x=THREE.MathUtils.clamp(player.position.x,-34,34);
player.position.z=THREE.MathUtils.clamp(player.position.z,-48,48);

walkers.forEach((w,i)=>{
w.position.x+=Math.sin(performance.now()*.00025+i)*dt*.35;
w.position.z+=Math.cos(performance.now()*.0002+i)*dt*.25;
});

camera.position.lerp(
new THREE.Vector3(player.position.x,7.5,player.position.z+11),.075);
camera.lookAt(player.position.x,1.1,player.position.z-1);

const h=Math.floor(minutes/60)%24;
const m=Math.floor(minutes%60);
document.getElementById('clock').textContent=
String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');

renderer.render(scene,camera);
}
animate();

function resize(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
})();
</script>
</body>
  </html>
